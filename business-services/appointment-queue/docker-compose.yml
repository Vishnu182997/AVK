services:
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/appointments
      DATABASE_USER: appointments
      DATABASE_PASSWORD: appointments
      REDIS_HOST: redis
      MAIL_HOST: mailpit
      JWT_SECRET: local-compose-secret-key-change-before-production-123456
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: appointments, POSTGRES_USER: appointments, POSTGRES_PASSWORD: appointments}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U appointments"], interval: 5s, timeout: 3s, retries: 10}
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
